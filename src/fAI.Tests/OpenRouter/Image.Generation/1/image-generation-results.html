<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Generation Results</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0f;
      color: #e2e2e2;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      padding: 48px 40px 32px;
      border-bottom: 1px solid #1e1e24;
      background: linear-gradient(180deg, #111118 0%, #0d0d0f 100%);
    }
    .header-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #5b5b72;
      margin-bottom: 10px;
    }
    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }
    .prompt-block {
      display: inline-flex;
      align-items: flex-start;
      gap: 12px;
      background: #16161e;
      border: 1px solid #2a2a38;
      border-radius: 10px;
      padding: 14px 18px;
      max-width: 860px;
    }
    .prompt-icon {
      font-size: 1rem;
      line-height: 1.5;
      flex-shrink: 0;
      opacity: 0.6;
    }
    .prompt-text {
      font-size: 0.92rem;
      color: #c9c9e0;
      line-height: 1.55;
      font-style: italic;
    }
    .stats-row {
      display: flex;
      gap: 28px;
      margin-top: 24px;
    }
    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .stat-label {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4e4e66;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 40px;
      border-bottom: 1px solid #1a1a22;
      gap: 16px;
      flex-wrap: wrap;
    }
    .sort-group {
      display: flex;
      gap: 6px;
    }
    .sort-btn {
      background: #16161e;
      border: 1px solid #2a2a38;
      color: #9090aa;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.02em;
    }
    .sort-btn:hover, .sort-btn.active {
      background: #22223a;
      border-color: #4a4a72;
      color: #d0d0f0;
    }
    .view-group {
      display: flex;
      gap: 6px;
    }
    .view-btn {
      background: #16161e;
      border: 1px solid #2a2a38;
      color: #9090aa;
      font-size: 1rem;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1;
    }
    .view-btn:hover, .view-btn.active {
      background: #22223a;
      border-color: #4a4a72;
      color: #d0d0f0;
    }

    /* ── Grid ── */
    .grid-container {
      padding: 32px 40px 60px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .grid.compact {
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
    }

    /* ── Card ── */
    .card {
      background: #111118;
      border: 1px solid #1e1e2c;
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      position: relative;
    }
    .card:hover {
      border-color: #3a3a5a;
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .card-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #0a0a10;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }
    .card:hover .card-img-wrap img {
      transform: scale(1.04);
    }
    .card-rank {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: #888;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      backdrop-filter: blur(6px);
      letter-spacing: 0.05em;
    }
    .card-zoom-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.0);
      transition: background 0.2s;
    }
    .card:hover .card-zoom-hint {
      background: rgba(0,0,0,0.25);
    }
    .zoom-icon {
      opacity: 0;
      font-size: 2rem;
      transition: opacity 0.2s;
    }
    .card:hover .zoom-icon {
      opacity: 0.9;
    }

    .card-body {
      padding: 14px 16px 16px;
    }
    .card-model {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.8rem;
      color: #8b9cf4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 10px;
      letter-spacing: 0.01em;
    }
    .card-meta {
      display: flex;
      gap: 12px;
    }
    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .meta-val {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .meta-val.cost { color: #4ade80; }
    .meta-val.dur  { color: #fbbf24; }
    .meta-lbl {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #3e3e56;
    }

    /* compact card overrides */
    .grid.compact .card-body { padding: 10px 12px 12px; }
    .grid.compact .card-model { font-size: 0.72rem; margin-bottom: 6px; }
    .grid.compact .meta-val { font-size: 0.74rem; }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5,5,10,0.96);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0;
    }
    #lightbox.open { display: flex; }

    #lightbox-close {
      position: fixed;
      top: 20px;
      right: 28px;
      font-size: 1.8rem;
      color: #666;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
      transition: color 0.15s;
      z-index: 10;
    }
    #lightbox-close:hover { color: #fff; }

    #lightbox-nav-prev,
    #lightbox-nav-next {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2rem;
      color: #444;
      cursor: pointer;
      background: rgba(255,255,255,0.04);
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      width: 48px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      z-index: 10;
    }
    #lightbox-nav-prev { left: 16px; }
    #lightbox-nav-next { right: 16px; }
    #lightbox-nav-prev:hover,
    #lightbox-nav-next:hover {
      color: #fff;
      background: rgba(255,255,255,0.08);
      border-color: #4a4a6a;
    }

    #lightbox-img-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 60px 80px 0;
    }
    #lightbox-img {
      max-width: 100%;
      max-height: calc(100vh - 160px);
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.8);
    }

    #lightbox-footer {
      width: 100%;
      padding: 20px 80px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #1a1a24;
      margin-top: 20px;
    }
    #lightbox-caption {
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #8b9cf4;
      font-size: 0.9rem;
    }
    #lightbox-meta {
      display: flex;
      gap: 24px;
      align-items: center;
    }
    .lb-meta-item { display: flex; flex-direction: column; gap: 2px; text-align: right; }
    .lb-meta-val {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .lb-meta-val.cost { color: #4ade80; }
    .lb-meta-val.dur  { color: #fbbf24; }
    .lb-meta-lbl {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: #3e3e56;
    }
    #lightbox-counter {
      font-size: 0.78rem;
      color: #3e3e56;
      min-width: 60px;
      text-align: center;
    }
  </style>
</head>

    let currentSort = 'rank';
    let currentIndex = 0;
    let currentItems = [...RAW];

    function fmtCost(c) { return '$' + c.toFixed(4); }
    function fmtDur(ms) {
      if (ms >= 60000) return (ms/60000).toFixed(1) + ' min';
      return (ms/1000).toFixed(1) + ' s';
    }

    function sortItems(key) {
      const arr = [...RAW];
      if (key === 'rank')         arr.sort((a,b) => a.rank - b.rank);
      else if (key === 'cost-asc')  arr.sort((a,b) => a.cost - b.cost);
      else if (key === 'cost-desc') arr.sort((a,b) => b.cost - a.cost);
      else if (key === 'duration-asc') arr.sort((a,b) => a.dur - b.dur);
      else if (key === 'name')    arr.sort((a,b) => a.model.localeCompare(b.model));
      return arr;
    }

    function renderGrid() {
      currentItems = sortItems(currentSort);
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      currentItems.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = idx;
        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${item.src}" alt="${item.model}" loading="lazy">
            <div class="card-rank">#${item.rank}</div>
            <div class="card-zoom-hint"><span class="zoom-icon">⤢</span></div>
          </div>
          <div class="card-body">
            <div class="card-model">${item.model}</div>
            <div class="card-meta">
              <div class="meta-item">
                <span class="meta-val cost">${fmtCost(item.cost)}</span>
                <span class="meta-lbl">Cost</span>
              </div>
              <div class="meta-item">
                <span class="meta-val dur">${fmtDur(item.dur)}</span>
                <span class="meta-lbl">Duration</span>
              </div>
            </div>
          </div>`;
        card.addEventListener('click', () => openLightbox(idx));
        grid.appendChild(card);
      });
    }

    function updateStats() {
      document.getElementById('stat-models').textContent = RAW.length;
      const costs = RAW.map(r => r.cost);
      document.getElementById('stat-min-cost').textContent = fmtCost(Math.min(...costs));
      document.getElementById('stat-max-cost').textContent = fmtCost(Math.max(...costs));
      const fastest = RAW.reduce((a,b) => a.dur < b.dur ? a : b);
      document.getElementById('stat-fastest').textContent = fmtDur(fastest.dur);
    }

    function openLightbox(idx) {
      currentIndex = idx;
      updateLightbox();
      document.getElementById('lightbox').classList.add('open');
    }

    function updateLightbox() {
      const item = currentItems[currentIndex];
      document.getElementById('lightbox-img').src = item.src;
      document.getElementById('lightbox-img').alt = item.model;
      document.getElementById('lightbox-caption').textContent = item.model;
      document.getElementById('lb-cost').textContent = fmtCost(item.cost);
      document.getElementById('lb-dur').textContent = fmtDur(item.dur);
      document.getElementById('lightbox-counter').textContent = `${currentIndex + 1} / ${currentItems.length}`;
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    function lightboxNav(dir) {
      currentIndex = (currentIndex + dir + currentItems.length) % currentItems.length;
      updateLightbox();
    }

    // Sort buttons
    document.querySelectorAll('.sort-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSort = btn.dataset.sort;
        renderGrid();
      });
    });

    // View buttons
    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const grid = document.getElementById('grid');
        if (btn.dataset.view === 'compact') grid.classList.add('compact');
        else grid.classList.remove('compact');
      });
    });

    // Lightbox backdrop click
    document.getElementById('lightbox').addEventListener('click', e => {
      if (e.target === document.getElementById('lightbox') ||
          e.target === document.getElementById('lightbox-img-wrap') ||
          e.target === document.getElementById('lightbox-footer')) {
        closeLightbox();
      }
    });

    // Keyboard
    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') lightboxNav(1);
      if (e.key === 'ArrowLeft')  lightboxNav(-1);
    });

    updateStats();
    renderGrid();
  </script>
</body>
</html>
